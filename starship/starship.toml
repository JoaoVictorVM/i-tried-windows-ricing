# ================================================================
# Configuração do Starship (prompt do terminal)
# Objetivo: ícone de pasta + caminho numa linha, seta na de baixo,
# sem mais nada aparecendo — visual limpo, igual à imagem de referência.
# Mantido por JV
# ================================================================

# Formato geral do prompt. Aqui a gente decide exatamente o que aparece:
# só o módulo de diretório, quebra de linha, e o caractere de digitação
# (a seta). Qualquer outro módulo que o Starship normalmente mostraria
# (git, versão de linguagem detectada na pasta, etc.) fica de fora,
# mesmo que ele detecte esse contexto — porque não tá listado aqui.
format = """
$directory
$character"""

# Deixa (ou não) uma linha em branco antes de cada prompt novo.
# Troque pra "false" se quiser os comandos mais colados um no outro.
add_newline = true

# ----------------------------------------------------------------
# MÓDULO: diretório atual
# Renderizado como uma "cápsula": dois glifos de meia-lua da Nerd
# Font (Powerline Extra) nas pontas, coloridos igual ao fundo da
# cápsula, criando a ilusão de canto arredondado contra o fundo
# do terminal — mesma técnica usada em temas prontos do Starship
# e do oh-my-posh (tipo o "pastel-powerline").
# ----------------------------------------------------------------
[directory]
# \ue0b6 e \ue0b4 são as meias-luas esquerda/direita. \uf07b é o
# ícone de pasta (mesmo de antes). $path já sai como "~" quando
# você tá na pasta do usuário.
format = "[\ue0b6](fg:#333333)[ \uf07b  $path ](bg:#333333 fg:#e6e6e6)[\ue0b4](fg:#333333)"

# Quantos níveis de pasta mostrar antes de truncar (corta o caminho
# se ele for muito comprido, pra não estourar a linha)
truncation_length = 3
truncate_to_repo = true

# Troca a barra "\" padrão do Windows por um separador mais claro
# visualmente entre os níveis da pasta (ex: "D: › Workspace" em vez
# de "D:\Workspace"). "\\" aqui representa uma única barra invertida
# (é a forma de escrever isso em TOML). Essa subtabela precisa vir
# por último dentro de [directory] — em TOML, depois que uma
# subtabela é declarada, não dá pra "voltar" pra chaves do pai.
[directory.substitutions]
"\\" = " \u203a "

# ----------------------------------------------------------------
# MÓDULO: caractere de digitação (a "seta")
# ----------------------------------------------------------------
[character]
success_symbol = "[→](bold white)"   # quando o último comando deu certo
error_symbol = "[→](bold red)"       # quando o último comando deu erro
